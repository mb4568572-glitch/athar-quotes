<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اقتباسات أثر</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:20px 12px;
  background-color:#d9c29d;
  background-image:repeating-linear-gradient(15deg,rgba(110,75,40,.035) 0px,rgba(110,75,40,.035) 1px,transparent 1px,transparent 5px);
  color:#49321f;
  font-family:"Segoe Print","Comic Sans MS",Tahoma,Arial,sans-serif;
}
.container{max-width:520px;margin:auto;text-align:center}
h1{font-size:29px;margin:12px 0 5px}
.subtitle{font-size:14px;margin-bottom:22px}
.paper{
  width:100%;
  aspect-ratio:9/16;
  max-height:650px;
  margin:15px auto;
  padding:28px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#f1e2c5;
  border:1px solid #c5a77d;
  border-radius:5px;
  box-shadow:0 8px 22px #65451e35;
  position:relative;
  overflow:hidden;
}
.paper:before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid #b99b70;
  pointer-events:none;
}
.brand{position:absolute;top:30px;font-size:15px}
#titleText{font-size:34px;line-height:1.8;font-weight:bold}
#quoteText{font-size:25px;line-height:2.1;font-weight:500}
.footer{position:absolute;bottom:30px;font-size:14px}
.controls{display:grid;gap:10px}
button{
  border:0;border-radius:9px;padding:13px;
  background:#65472e;color:white;
  font-size:16px;font-family:inherit;
  cursor:pointer;
}
button.secondary{background:#8b6b48}
button:active{transform:scale(.98)}
textarea{
  width:100%;min-height:75px;padding:12px;
  border:1px solid #a98a63;border-radius:8px;
  background:#f7ecd8;color:#49321f;
  font:15px Tahoma,Arial,sans-serif;
  margin-top:10px;
}
</style>
</head>
<body>
<div class="container">
  <h1>اقتباسات أثر</h1>
  <div class="subtitle">كلمات تترك أثرًا في القلب</div>

  <div class="paper">
    <div class="brand">𓂀 اقتباسات أثر</div>
    <div id="titleText">كلمة تضيء قلبك</div>
    <div id="quoteText" hidden></div>
    <div class="footer">اترك أثرًا طيبًا أينما كنت</div>
  </div>

  <div class="controls">
    <button onclick="showQuote()">عرض الحكمة</button>
    <button class="secondary" onclick="nextQuote()">حكمة جديدة</button>
    <button class="secondary" onclick="showTitle()">العودة للعنوان</button>
    <button onclick="copyCaption()">نسخ الوصف</button>
    <button onclick="copyTags()">نسخ الهاشتاجات</button>
  </div>

  <textarea id="caption" readonly>اجعل كلماتك أثرًا طيبًا لا يُنسى 🌿</textarea>
  <textarea id="tags" readonly>#اقتباسات_أثر #حكمة #كلمات_راقية</textarea>
</div>

<script>
const quotes = [
  "ازرع خيرًا ولو في غير موضعه، فالله لا يضيع أجر المحسنين.",
  "ليس الجمال في كثرة الكلام، بل في صدق المعنى.",
  "اجعل بينك وبين الله طريقًا لا يعرفه أحد.",
  "قد تتأخر الأمنيات، لكن تدبير الله يأتي في أجمل وقت.",
  "الكلمة الطيبة صدقة، فلا تبخل بها.",
  "لا تيأس من رحمة الله، فبعد العسر يسر.",
  "من أصلح سريرته أصلح الله علانيته.",
  "كن خفيف الأثر، جميل الذكر، طيب الكلام.",
  "القلب الذي يطمئن بذكر الله لا تهزمه ضوضاء الحياة.",
  "افعل الخير ابتغاء وجه الله، لا انتظارًا لشكر الناس."
];

let current = 0;

function showQuote(){
  document.getElementById("titleText").hidden = true;
  document.getElementById("quoteText").hidden = false;
  document.getElementById("quoteText").textContent = quotes[current];
}

function showTitle(){
  document.getElementById("titleText").hidden = false;
  document.getElementById("quoteText").hidden = true;
}

function nextQuote(){
  current = (current + 1) % quotes.length;
  showQuote();
}

function copyCaption(){
  copyText(document.getElementById("caption").value);
}

function copyTags(){
  copyText(document.getElementById("tags").value);
}

function copyText(value){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(value)
      .then(()=>alert("تم نسخ النص"))
      .catch(()=>fallbackCopy(value));
  }else{
    fallbackCopy(value);
  }
}

function fallbackCopy(value){
  const area=document.createElement("textarea");
  area.value=value;
  document.body.appendChild(area);
  area.select();
  try{
    document.execCommand("copy");
    alert("تم نسخ النص");
  }catch(e){
    alert("تعذر النسخ، حدد النص وانسخه يدويًا");
  }
  area.remove();
}
</script>
</body>
</html>
